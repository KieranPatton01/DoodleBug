<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Doodlebug</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Plus+Jakarta+Sans:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #1c1917;
    }
    header {
      position: sticky;
      top: 0;
      z-index: 50;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 24px;
      background: rgba(255, 253, 245, 0.9);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--stone-line, #E7E5E4);
    }
    .header-brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      font-size: 1.15rem;
      color: #292524;
    }
    .header-brand .logo-icon {
      font-size: 1.35rem;
    }
    .header-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.75rem;
      font-weight: 600;
      padding: 3px 10px;
      border-radius: 9999px;
      background: #ecfdf5;
      color: #059669;
      border: 1px solid #a7f3d0;
    }
    .badge-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #10b981;
    }
    main {
      flex: 1;
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 24px 16px;
    }
    .stage-wrapper {
      width: 100%;
      max-width: 860px;
      margin: 0 auto;
      box-shadow: 0 4px 25px -4px rgba(0, 0, 0, 0.06);
      border-radius: 16px;
      overflow: hidden;
      background: #ffffff;
      border: 1px solid var(--stone-line, #E7E5E4);
    }
    #doodle-stage {
      width: 100%;
      min-height: 400px;
      border: none;
      display: block;
    }
    footer {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px 24px;
      font-size: 0.875rem;
      color: #78716c;
      border-top: 1px solid var(--stone-line, #E7E5E4);
      background: rgba(255, 253, 245, 0.9);
    }
  </style>
</head>
<body>
  <header>
    <div class="header-brand">
      <span class="logo-icon">🐛</span>
      <span>Doodlebug</span>
    </div>
    <div class="header-badge">
      <span class="badge-dot"></span>
      <span>live</span>
    </div>
  </header>

  <main>
    <div class="stage-wrapper">
      <iframe
        src="canvas.html"
        id="doodle-stage"
        sandbox="allow-scripts allow-modals allow-popups"
        scrolling="no"
        loading="eager"
        title="Doodlebug Canvas"
      ></iframe>
    </div>
  </main>

  <footer>
    <p>made with love ♡ • Doodlebug</p>
  </footer>

  <script src="iframe-resizer.js"></script>
</body>
</html>
