<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Canvas</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .dot-grid {
      background-color: #faf9f5;
      background-image: radial-gradient(#dedbd2 1.2px, transparent 1.2px);
      background-size: 24px 24px;
    }
  </style>
</head>
<body class="m-0 p-0 w-full min-h-screen dot-grid flex flex-col items-center justify-center">
  <div class="flex flex-col items-center justify-center w-full px-4" style="margin-top: -15vh;">
    <!-- Polaroid Frame Container -->
    <div class="bg-white p-2.5 pb-6 shadow-[0_4px_16px_rgba(0,0,0,0.08)] border border-neutral-100 flex flex-col items-center max-w-[260px] w-full">
      <div class="w-full aspect-square overflow-hidden bg-neutral-100">
        <img 
          src="https://media.giphy.com/media/MDJ9IbxxvDUQM/giphy.gif" 
          alt="Cat GIF" 
          class="w-full h-full object-cover block select-none pointer-events-none"
        />
      </div>
    </div>
  </div>

  <!-- Doodlebug Auto-Resizing Protocol -->
  <script>
    (function() {
      function notifyParent() {
        var h = Math.max(document.body.scrollHeight, document.documentElement.scrollHeight);
        if (window.parent && window.parent !== window) {
          window.parent.postMessage({ type: 'doodle-resize', height: h }, '*');
        }
      }
      window.addEventListener('load', notifyParent);
      window.addEventListener('resize', notifyParent);
      if (window.ResizeObserver) {
        new ResizeObserver(notifyParent).observe(document.body);
      }
      setTimeout(notifyParent, 500);
    })();
  </script>
</body>
</html>
